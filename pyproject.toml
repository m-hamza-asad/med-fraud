[project]
name = "shahai-med-fraud"
version = "0.1.0"
description = "Local UAE medical claims payment-integrity proof of concept"
requires-python = ">=3.12,<3.14"

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
addopts = "-q --disable-warnings --basetemp=.pytest-tmp"
pythonpath = ["apps/api"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "apps/web/node_modules", "apps/web/dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
